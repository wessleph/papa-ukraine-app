<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0057b7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="UA-Hilfe">
<title>Christoph for Ukraine</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="app-header">
  <img class="app-header__icon" src="icons/icon-96.png" alt="">
  <h1 class="app-header__title">Christoph for Ukraine</h1>
</header>

<main id="view-root" class="view-root">
  <!-- ===================== CHECKLISTE ===================== -->
  <section id="view-checkliste" class="view">
    <div class="view-header">
      <h2>Checkliste</h2>
      <button id="btn-add-category" class="btn btn--secondary btn--small">+ Kategorie</button>
    </div>
    <div id="checkliste-content"></div>
  </section>

  <!-- ===================== TRACKER ===================== -->
  <section id="view-tracker" class="view">
    <div class="view-header">
      <h2>Spenden-Tracker</h2>
    </div>

    <div class="subsection-header">
      <h3>Sachspenden</h3>
      <button id="btn-add-donation" class="btn btn--secondary btn--small">+ Spende</button>
    </div>
    <div id="tracker-stats" class="stats-box"></div>
    <div id="tracker-content"></div>

    <div class="subsection-header">
      <h3>Spendengelder</h3>
      <button id="btn-add-finanzen" class="btn btn--secondary btn--small">+ Eintrag</button>
    </div>
    <div id="finanzen-stats" class="stats-box stats-box--money"></div>
    <div id="finanzen-content"></div>
  </section>

  <!-- ===================== FAHRTEN ===================== -->
  <section id="view-fahrten" class="view">
    <div class="view-header">
      <h2>Fahrten-Tagebuch</h2>
      <button id="btn-add-fahrt" class="btn btn--secondary btn--small">+ Fahrt</button>
    </div>
    <div id="fahrten-content"></div>
  </section>

  <!-- ===================== NOTFALL ===================== -->
  <section id="view-notfall" class="view">
    <div class="view-header">
      <h2>Notfall-Infos</h2>
    </div>
    <div id="notfall-content"></div>
  </section>
</main>

<nav class="bottom-nav">
  <button class="nav-btn" data-view="checkliste">
    <span class="nav-btn__icon">📋</span>
    <span class="nav-btn__label">Checkliste</span>
  </button>
  <button class="nav-btn" data-view="tracker">
    <span class="nav-btn__icon">📦</span>
    <span class="nav-btn__label">Tracker</span>
  </button>
  <button class="nav-btn" data-view="fahrten">
    <span class="nav-btn__icon">🚐</span>
    <span class="nav-btn__label">Fahrten</span>
  </button>
  <button class="nav-btn" data-view="notfall">
    <span class="nav-btn__icon">🆘</span>
    <span class="nav-btn__label">Notfall</span>
  </button>
</nav>

<div id="update-banner" class="update-banner" hidden>
  <span>Neue Version verfügbar</span>
  <button id="update-banner-btn" class="btn btn--secondary btn--small">Aktualisieren</button>
</div>

<div id="tour-overlay" class="tour-overlay" hidden>
  <div class="tour-card" role="dialog" aria-modal="true" aria-labelledby="tour-title">
    <button id="tour-skip" class="tour-skip">Überspringen</button>
    <div id="tour-icon" class="tour-icon"></div>
    <h2 id="tour-title"></h2>
    <div id="tour-text" class="tour-text"></div>
    <div id="tour-dots" class="tour-dots"></div>
    <div class="tour-actions">
      <button id="tour-back" class="btn btn--secondary">Zurück</button>
      <button id="tour-next" class="btn btn--primary">Weiter</button>
    </div>
  </div>
</div>

<!-- generic modal -->
<div id="modal-overlay" class="modal-overlay">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-cancel" class="btn btn--secondary">Abbrechen</button>
      <button id="modal-confirm" class="btn btn--primary">Speichern</button>
    </div>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script src="js/checklist.js"></script>
<script src="js/tracker.js"></script>
<script src="js/finanzen.js"></script>
<script src="js/fahrten.js"></script>
<script src="js/notfall.js"></script>
<script src="js/tour.js"></script>
<script src="js/app.js"></script>
</body>
</html>
